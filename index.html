      +'<div class="form-field"><label>Survey</label><select id="up-survey"><option value="pre">Pre-Training</option><option value="post">Post-Training</option></select></div>'
      +'<div class="form-field"><label>Target Size</label><input type="number" id="up-target" value="60"/></div>'
      +'<div class="form-field"><label>Audience (comma-separated)</label><input id="up-audience" value="AM,NCA"/></div>'
      +'</div>'
      +'<div style="display:flex;gap:10px;margin-top:16px;">'
      +'<button class="btn btn-ghost" onclick="initUpload()">← Back</button>'
      +'<button class="btn btn-teal" onclick="wizardStep2Next()">Next →</button>'
      +'</div>';
  } else if(s.step===3){
    const hdrs=s.headers;
    const metaH=hdrs.filter(h=>META_COLS.some(m=>h.toLowerCase().includes(m)));
    const autoName=hdrs.find(h=>h.toLowerCase()==='name')||hdrs.find(h=>h.toLowerCase().includes('name'))||hdrs[0]||'';
    const autoScore=hdrs.find(h=>/total.?point/i.test(h))||hdrs.find(h=>/^score$/i.test(h))||'';
    const nameDropCols=metaH.length?metaH:hdrs;
    const nOpts=nameDropCols.map(h=>'<option value="'+escH(h)+'"'+(h===autoName?' selected':'')+'>'+escH(h)+'</option>').join('');
    const sOpts='<option value="">— skip (no scoring) —</option>'+hdrs.map(h=>'<option value="'+escH(h)+'"'+(h===autoScore?' selected':'')+'>'+escH(h)+'</option>').join('');
    // Show real question cols (skip Points/Feedback)
    const qCols=hdrs.filter(h=>!META_COLS.some(m=>h.toLowerCase().includes(m))&&!MSFORMS_SKIP.test(h));
    const qPreview=qCols.length?'<div style="margin-top:12px;"><div style="font-size:12px;font-weight:700;color:var(--navy);margin-bottom:6px;">Question columns ('+qCols.length+'):</div>'
      +'<div style="max-height:100px;overflow-y:auto;background:#f8f9fe;border-radius:8px;padding:8px 12px;">'
      +qCols.map((h,i)=>'<div style="font-size:11px;color:var(--muted);padding:2px 0;">'+(i+1)+'. '+(h.length>70?h.slice(0,70)+'…':h)+'</div>').join('')
      +'</div></div>':'';
    body='<div class="form-grid">'
      +'<div class="form-field"><label>Trainee Name Column</label><select id="map-name">'+nOpts+'</select></div>'
      +'<div class="form-field"><label>Score Column (Total Points)</label><select id="map-score">'+sOpts+'</select></div>'
      +'</div>'+qPreview
      +'<div style="display:flex;gap:10px;margin-top:16px;">'
      +'<button class="btn btn-ghost" onclick="setStep(2)">← Back</button>'
      +'<button class="btn btn-teal" onclick="wizardStep3Next()">Preview →</button>'
      +'</div>';
  } else if(s.step===4){
    const prev=s.previewTrainees.slice(0,10);
    const rows=prev.map(tr=>'<tr><td>'+escH(tr.name)+'</td><td><span class="badge badge-navy">'+tr.role+'</span></td><td>'+scoreBar(tr.pre)+'</td></tr>').join('');
    body='<p style="font-size:13px;margin-bottom:12px;"><strong>'+escH(s.details.name)+'</strong> &bull; '+s.previewTrainees.length+' trainees &bull; '+s.details.survey+' survey</p>'
      +'<div class="tbl-wrap" style="max-height:280px;overflow-y:auto;"><table><thead><tr><th>Name</th><th>Role</th><th>Score</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      +(s.previewTrainees.length>10?'<p style="font-size:12px;color:var(--muted);margin-top:6px;">…and '+(s.previewTrainees.length-10)+' more</p>':'')
      +'<div style="display:flex;gap:10px;margin-top:16px;">'
      +'<button class="btn btn-ghost" onclick="setStep(3)">← Back</button>'
      +'<button class="btn btn-teal" onclick="confirmUpload()">✓ Confirm Upload</button>'
      +'</div>';
  } else if(s.step===5){
    body='<div style="text-align:center;padding:40px;">'
      +'<div style="font-size:64px;margin-bottom:16px;">✅</div>'
      +'<div style="font-size:18px;font-weight:700;color:var(--navy);margin-bottom:8px;">Upload Complete!</div>'
      +'<p style="font-size:13px;color:var(--muted);margin-bottom:20px;">Data saved to local storage automatically.</p>'
      +'<div style="display:flex;gap:12px;justify-content:center;">'
      +'<button class="btn btn-teal" onclick="switchTab(\'gap\')">View Gap Analysis</button>'
      +'<button class="btn btn-navy" onclick="initUpload()">Upload Another</button>'
      +'</div></div>';
  }
  el('tab-upload').innerHTML=
    '<div class="card"><div class="card-title">⬆ Upload Training Data</div>'
    +'<div class="wizard-steps">'+stepsHtml+'</div>'
    +'<div id="wizard-content">'+body+'</div>'
    +'</div>';
}

function initUpload(){
  uploadState={step:1,file:null,headers:[],rows:[],format:'',details:{},mapping:{},previewTrainees:[]};
  renderUpload();
}
function setStep(n){uploadState.step=n;renderUpload();}

window.handleDrop=function(e){
  e.preventDefault();
  el('up-zone').classList.remove('dragover');
  if(e.dataTransfer.files[0])processFile(e.dataTransfer.files[0]);
};
window.handleFileSelect=function(inp){if(inp.files[0])processFile(inp.files[0]);};

function processFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    const lines=e.target.result.split('\n').filter(l=>l.trim());
    if(!lines.length){showToast('Empty file','error');return;}
    // Robust CSV parse (handles quoted commas)
    function parseCSVLine(line){
      const res=[];let cur='';let inQ=false;
      for(let i=0;i<line.length;i++){
        if(line[i]==='"'){inQ=!inQ;}
        else if(line[i]===','&&!inQ){res.push(cur.trim());cur='';}
        else cur+=line[i];
      }
      res.push(cur.trim());
      return res.map(s=>s.replace(/^"|"$/g,'').trim());
    }
    const headers=parseCSVLine(lines[0]);
    const rows=lines.slice(1).map(l=>parseCSVLine(l));
    let format='Generic';
    if(headers.some(h=>/total.?points?/i.test(h)))format='MS Forms';
    else if(headers.some(h=>/user.?name/i.test(h))&&headers.some(h=>/poll/i.test(h)))format='Zoom Poll';
    uploadState.file=file;uploadState.headers=headers;uploadState.rows=rows;uploadState.format=format;
    setStep(2);
  };
  reader.readAsText(file);
}

function wizardStep2Next(){
  const name=el('up-name').value.trim();
  if(!name){showToast('Please enter a training name','error');return;}
  uploadState.details={
    name,date:el('up-date').value,type:el('up-type').value,
    survey:el('up-survey').value,target:parseInt(el('up-target').value)||60,
    audience:el('up-audience').value.split(',').map(s=>s.trim()).filter(Boolean)
  };
  setStep(3);
}

function wizardStep3Next(){
  const nameCol=el('map-name').value;
  const scoreCol=el('map-score').value;
  uploadState.mapping={name:nameCol,score:scoreCol};
  const headers=uploadState.headers;
  const nameIdx=headers.indexOf(nameCol);
  const scoreIdx=scoreCol?headers.indexOf(scoreCol):-1;
  const survey=uploadState.details.survey;
  const trainees=uploadState.rows
    .filter(r=>r[nameIdx]&&r[nameIdx].trim())
    .map(r=>{
      const score=scoreIdx>=0?parseScore(r[scoreIdx]):null;
      return {name:r[nameIdx].trim(),role:'AM',
        pre:survey==='pre'?score:null,post:survey==='post'?score:null,
        session:survey,competencyScores:{pre:{},post:{}}};
    });
  if(!trainees.length){showToast('No trainees found — check Name Column selection','error');return;}
  uploadState.previewTrainees=trainees;
  setStep(4);
}

function confirmUpload(){
  const d=uploadState.details;
  const survey=d.survey;
  const trainees=uploadState.previewTrainees;
  const headers=uploadState.headers;
  const rows=uploadState.rows;
  const nameIdx=headers.indexOf(uploadState.mapping.name);

  // Build questions — skip Points– and Feedback– columns
  const qCols=headers.filter(h=>!META_COLS.some(m=>h.toLowerCase().includes(m))&&!MSFORMS_SKIP.test(h));
  const pointsCols={};
  headers.forEach((h,i)=>{
    const m=h.match(/^points\s*[\-\u2014]\s*(.+)/i);
    if(m)pointsCols[m[1].trim().toLowerCase()]=i;
  });

  const questions=qCols.map(qText=>{
    const qIdx=headers.indexOf(qText);
    // Try to find matching Points column
    const ptIdx=pointsCols[qText.toLowerCase()]!==undefined?pointsCols[qText.toLowerCase()]:-1;
    let correct=0,total=0;
    rows.forEach(r=>{
      if(!r[nameIdx]||!r[nameIdx].trim())return;
      total++;
      if(ptIdx>=0){
        const pts=parseScore(r[ptIdx]);
        if(pts!==null&&pts>0)correct++;
      }
    });
    // Match to QBank
    const qbMatch=QUESTION_BANK.find(q=>q.text===qText||qText.includes(q.text.slice(0,30)));
    return {text:qText,competency:qbMatch?qbMatch.pillar:'',type:qbMatch?qbMatch.type:'Multiple Choice',
      difficulty:qbMatch?qbMatch.difficulty:'Medium',survey,correct,total};
  });

  let training=TRAININGS.find(t=>t.name===d.name);
  if(training){
    if(survey==='pre'){training.respondents.pre+=trainees.length;}
    else{training.respondents.post+=trainees.length;}
    trainees.forEach(tr=>{
      const found=training.trainees.find(et=>et.name===tr.name);
      if(found){if(survey==='pre'){found.pre=tr.pre;found.session=found.session==='post'?'both':'pre';}
      else{found.post=tr.post;found.session=found.session==='pre'?'both':'post';}}
      else training.trainees.push(tr);
    });
    // Merge questions
    questions.forEach(q=>{if(!training.questions.find(x=>x.text===q.text))training.questions.push(q);});
  } else {
    const gapScores={};PILLARS.forEach(p=>{gapScores[p]=null;});
    training={id:uid(),name:d.name,type:d.type,date:d.date,targetAudience:d.audience,
      targetSize:d.target,respondents:{pre:survey==='pre'?trainees.length:0,post:survey==='post'?trainees.length:0},
      gapScores,preScores:{},postScores:{},recommendations:{},trainees,questions};
    TRAININGS.push(training);
  }

  // Auto-calc gap scores from QBank
  const qbMatches=QUESTION_BANK.filter(q=>q.training===d.name);
  if(qbMatches.length){
    const byPillar={};
    qbMatches.forEach(q=>{if(!q.pillar)return;if(!byPillar[q.pillar])byPillar[q.pillar]={c:0,t:0};byPillar[q.pillar].c+=q.correct||0;byPillar[q.pillar].t+=q.total||0;});
    Object.entries(byPillar).forEach(([p,v])=>{
      if(v.t>0){
        const pct=Math.round(v.c/v.t*100);
        training.gapScores[p]=pct;
        if(survey==='pre')training.preScores[p]=pct;
        else training.postScores[p]=pct;
      }
    });
    showToast('Gap scores auto-calculated from '+qbMatches.length+' Question Bank entries','success');
  } else {
    showToast('Upload complete! Add questions to Question Bank to auto-calculate gap scores.','info',4000);
  }

  autoSave();setStep(5);
}
